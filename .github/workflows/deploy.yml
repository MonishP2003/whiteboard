name: Deploy

on:
  push:
    branches: [main]

# Two merges never deploy at the same time; the later one waits.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  image:
    # Native ARM runner. If it isn't available for this repo, switch to
    # ubuntu-24.04 and add docker/setup-qemu-action before buildx (slower).
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.service == 'api' && vars.ECR_API_REPOSITORY_URL || vars.ECR_FRONTEND_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

  # API first: it runs the (additive) migrations, and the new frontend may call
  # new endpoints. If the new version isn't serving /api/health within 60 s, the
  # previous image is put back and the run fails (so the frontend isn't deployed).
  deploy-api:
    needs: image
    runs-on: ubuntu-24.04
    env:
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      HEALTH_URL: https://${{ vars.CLOUDFRONT_DOMAIN }}/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload deploy files
        run: aws s3 cp infra/docker/api/ "s3://$ARTIFACTS_BUCKET/deploy/api/" --recursive

      - name: Deploy API via SSM
        id: deploy
        run: >
          bash .github/scripts/ssm-deploy.sh api
          "${{ vars.API_INSTANCE_ID }}" "${{ vars.ECR_API_REPOSITORY_URL }}" "$IMAGE_TAG"

      # 200 alone isn't enough: the old container keeps answering if the new one never starts.
      - name: Wait for the new version on /api/health
        run: |
          for _ in $(seq 1 12); do
            body=$(curl -fsS --max-time 5 "$HEALTH_URL" || true)
            if [ "$(jq -r '.version // empty' <<<"$body" 2>/dev/null)" = "$IMAGE_TAG" ]; then
              echo "$body"; exit 0
            fi
            sleep 5
          done
          echo "::error::$IMAGE_TAG not healthy at $HEALTH_URL after 60 s (last response: ${body:-none})"
          exit 1

      # Also covers a deploy.sh that failed part-way (e.g. a migration error).
      - name: Roll back API
        id: rollback
        if: failure() && steps.deploy.outcome != 'skipped'
        run: >
          bash .github/scripts/ssm-run.sh "${{ vars.API_INSTANCE_ID }}"
          "rollback api ${IMAGE_TAG:0:7}" "bash /opt/whiteboard/rollback.sh"

      # The job is red either way; this reports whether the rollback brought the API back.
      - name: Check /api/health after rollback
        if: failure() && steps.deploy.outcome != 'skipped'
        run: |
          for _ in $(seq 1 12); do
            if body=$(curl -fsS --max-time 5 "$HEALTH_URL"); then
              echo "::warning::Rolled back. Now serving: $body"; exit 0
            fi
            sleep 5
          done
          echo "::error::API still unhealthy after rollback (rollback step: ${{ steps.rollback.outcome }})"
          exit 1

  # A separate job that needs deploy-api: runs only if the API deploy and its health
  # check passed.
  deploy-frontend:
    needs: deploy-api
    runs-on: ubuntu-24.04
    env:
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload deploy files
        run: aws s3 cp infra/docker/frontend/ "s3://$ARTIFACTS_BUCKET/deploy/frontend/" --recursive

      # deploy.sh waits for the container's /healthz and rolls itself back if it fails.
      - name: Deploy frontend via SSM
        run: >
          bash .github/scripts/ssm-deploy.sh frontend
          "${{ vars.FRONTEND_INSTANCE_ID }}" "${{ vars.ECR_FRONTEND_REPOSITORY_URL }}" "$IMAGE_TAG"

      - name: Check the site through CloudFront
        run: curl -fsS --max-time 10 -o /dev/null -w "%{http_code}\n" "https://${{ vars.CLOUDFRONT_DOMAIN }}/"
